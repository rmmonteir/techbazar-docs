name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Sync environment with uv
        run: uv sync --group dev

      - name: Run pytest with coverage gate
        run: uv run pytest tests --cov=cart --cov-report=term-missing --cov-fail-under=80
